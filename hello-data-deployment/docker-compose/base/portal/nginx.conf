user nginx;
worker_processes auto;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  include /etc/nginx/conf.d/*.conf;
  default_type application/octet-stream;

  # Don't tell nginx version to clients.
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  client_header_timeout 10m;
  client_body_timeout 10m;
  send_timeout 10m;

  connection_pool_size 256;
  client_max_body_size 5m;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/atom+xml
    application/geo+json
    application/javascript
    application/x-javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rdf+xml
    application/rss+xml
    application/xhtml+xml
    application/xml
    font/eot
    font/otf
    font/ttf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 75 20;

  ignore_invalid_headers on;

  # proxy_headers_hash_max_size 1024;
  # proxy_headers_hash_bucket_size 128;

  # Sets a $real_scheme variable whose value is the scheme passed by the load
  # balancer in X-Forwarded-Proto (if any), defaulting to $scheme.
  # Similar to how the HttpRealIp module treats X-Forwarded-For.
  map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Sets a $real_port variable whose value is the port passed by the load
  # balancer in X-Forwarded-Port (if any), defaulting to $server_port.
  map $http_x_forwarded_port $real_port {
    default $http_x_forwarded_port;
    ''      $server_port;
  }

  # Định nghĩa map để trích xuất token từ cookie
  map $http_cookie $auth_token {
    default "";
    "~*auth.access_token=([^;]+)" $1;
  }

  # prevent clickjacking
  add_header X-Frame-Options SAMEORIGIN;

  # X-XSS-Protection
  add_header X-XSS-Protection "1; mode=block";

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  server {
    listen 127.0.0.1:80;
    server_name 127.0.0.1;

    location = /stub_status {
      stub_status;
    }
  }

  server {
    listen 80;
    listen [::]:80;

    root /app/;
    client_max_body_size 1024m;
    index index.html index.htm;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Cấu hình CORS chung cho server
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Max-Age' 1728000 always;

    location = / {
      absolute_redirect off;
      rewrite ^/$ /app/ redirect;
      try_files $uri $uri/ @app;
    }

    location @app {
      rewrite ^$ /app/ redirect;
      rewrite ^/$ /app/ redirect;
      rewrite ^/app$ /index.html;
      rewrite ^/app.*$ /index.html;
      try_files $uri $uri/ /index.html;
    }

    location /app {
      alias /app/;
      try_files $uri @app;
    }

    # Portal API
    location /api/ {
      proxy_pass http://192.168.51.168:8081/api/;
      proxy_set_header Host $host;
      # proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $real_scheme;
      proxy_set_header X-Forwarded-Port $server_port;

      # Enable keepalive
      # proxy_http_version 1.1;
      # proxy_set_header Connection "";

      # Pass authorization headers
      # proxy_set_header Authorization $http_authorization;
      # proxy_pass_header Authorization;

      # Error handling
      # proxy_intercept_errors on;
      # error_page 502 503 504 /50x.html;

      # Debug headers
      # add_header X-Debug-Host $host;
      # add_header X-Debug-Uri $uri;
      # add_header X-Debug-Forwarded-For $proxy_add_x_forwarded_for;

      # Chuyển tiếp cookie
      # proxy_set_header Cookie $http_cookie;

      # Trích xuất token từ cookie và thêm vào header Authorization
      # proxy_set_header Authorization "Bearer $auth_token";
    }

    location /api/health {
      proxy_pass http://192.168.51.168:8081/api/actuator/health;
      proxy_set_header Host $host:$server_port;
      access_log off;
      proxy_read_timeout 5s;
      proxy_connect_timeout 5s;
      proxy_send_timeout 5s;
    }

    # Docs API
    location /dbt-docs/ {
      proxy_pass http://192.168.51.168:8086/dbt-docs/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $real_scheme;

      # Chuyển tiếp cookie
      proxy_set_header Cookie $http_cookie;

      # Trích xuất token từ cookie và thêm vào header Authorization
      proxy_set_header Authorization "Bearer $auth_token";
    }

    # Airflow
    location /airflow/ {
