    # DataGov
    location /datagov/ {
        proxy_pass http://192.168.51.165:8585;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cấu hình WebSocket (nếu OpenMetadata sử dụng WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tăng timeout để xử lý các yêu cầu lâu
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;

        # Tắt buffering để cải thiện hiệu suất streaming
        proxy_buffering off;

        # Chuyển tiếp cookie
        proxy_set_header Cookie $http_cookie;

        # Trích xuất token từ cookie và thêm vào header Authorization
        proxy_set_header Authorization "Bearer $auth_token";
    }

