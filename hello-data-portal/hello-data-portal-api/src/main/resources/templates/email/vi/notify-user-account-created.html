<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org">
  <body>
    <p>Xin chào <span th:text="${#objects.nullSafe(AFFECTED_USER_FIRST_NAME, '_Unknown_')}"/></p>

    <p>
        Người quản trị <span th:text="${#objects.nullSafe(FIRST_NAME_LAST_NAME_OF_USER_THAT_MADE_CHANGE, '_Unknown_')}"/>
        đã tạo một tài khoản người dùng cho bạn trong HelloDATA trong Miền nghiệp vụ dữ liệu
        <span th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unknown_')}"/> với vai trò sau.
    </p>

    <ul>
        <li th:if="${BUSINESS_DOMAIN_ROLE_NAME != 'NONE'}">
            Vai trò Miền nghiệp vụ dữ liệu <span
                th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unknown_') + ': ' + #objects.nullSafe(BUSINESS_DOMAIN_ROLE_NAME, '_Unknown_')}"></span></span>
        </li>
    </ul>
    <div th:each="item : ${DATA_DOMAIN_ROLES}">
        <ul th:if="${item.role.name != 'NONE'}">
            <li>
                Vai trò Miền dữ liệu <span th:text="${item.context.name + ': ' + item.role.name}"></span>
            </li>
        </ul>
    </div>

    <p>Link tới Miền nghiệp vụ dữ liệu
        <a th:href="${#objects.nullSafe(link, '_Unknown_')}"><span
                th:text="${#objects.nullSafe(BUSINESS_DOMAIN_NAME, '_Unknown_')}"/></a>
    </p>

    <p>Kind regards<br/>HelloDATA</p>

  </body>
</html>
